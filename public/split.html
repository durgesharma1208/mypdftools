<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split PDF | MyPDFTools</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h1>
        <a href="index.html" style="color:white;text-decoration:none;">
            MyPDFTools
        </a>
    </h1>
</nav>

<div class="container">

    <h2>✂️ Split PDF</h2>
    <p>Select a PDF and enter the page number to extract.</p>
<a href="index.html">
    <button type="button">
        ← Back to Home
    </button>
</a>

<br><br>
    <form action="/split" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="pdfFile"
            accept=".pdf"
            required>

        <br><br>

        <input
            type="number"
            name="pageNumber"
            placeholder="Enter Page Number"
            min="1"
            required>

        <br><br>
<div id="pdfPreview"></div>

<canvas id="pdfCanvas" style="
max-width:100%;
margin-top:20px;
border-radius:12px;
display:none;
"></canvas>

        <button type="submit">
            Split PDF
        </button>

    </form>
    <div class="loader" id="loader"></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>
</body>
</html>

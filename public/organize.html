<!DOCTYPE html>
<html>
<head>
    <title>Organize PDF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h2>📑 Organize PDF</h2>

<form action="/organize"
      method="POST"
      enctype="multipart/form-data">

<input type="file"
       name="pdfFile"
       accept=".pdf"
       required>

<br><br>

<input type="text"
       name="order"
       placeholder="Example: 3,1,2,5,4"
       required>

<br><br>
<div id="pdfPreview"></div>

<canvas id="pdfCanvas" style="
max-width:100%;
margin-top:20px;
border-radius:12px;
display:none;
"></canvas>

<button type="submit">
Organize PDF
</button>

</form>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>
</body>
</html>

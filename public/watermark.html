<!DOCTYPE html>
<html>
<head>
    <title>Add Watermark</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h1><a href="index.html" style="color:white;text-decoration:none;">📄 MyPDFTools</a></h1>
</nav>

<div class="container">

<h2>🏷️ Add Watermark</h2>

<form action="/watermark" method="POST" enctype="multipart/form-data">

<input type="file"
name="pdfFile"
accept=".pdf"
required>

<br><br>

<input type="text"
name="watermark"
placeholder="Enter Watermark Text"
required>

<br><br>

<label>Font Size</label><br>
<input type="number"
name="size"
value="40"
min="10"
max="150">

<br><br>

<label>Transparency (0.1 - 1)</label><br>
<input type="range"
name="opacity"
min="0.1"
max="1"
step="0.1"
value="0.3">

<br><br>

<label>Rotation</label><br>
<select name="rotation">
    <option value="0">0°</option>
    <option value="45" selected>45°</option>
    <option value="90">90°</option>
</select>

<br><br>

<label>Position</label><br>
<select name="position">
    <option value="center">Center</option>
    <option value="top">Top</option>
    <option value="bottom">Bottom</option>
</select>

<br><br>

<button type="submit">
Add Watermark
</button>

</form>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>
</body>
</html>

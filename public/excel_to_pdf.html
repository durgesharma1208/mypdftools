<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel to PDF</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
<h1><a href="index.html" style="color:white;text-decoration:none;">MyPDFTools</a></h1>
</nav>

<div class="container">

<h2>Excel to PDF</h2>
<p>Convert XLS and XLSX files into PDF.</p>

<a href="index.html">
<button type="button">← Back to Home</button>
</a>

<br><br>

<form action="/excel-to-pdf" method="POST" enctype="multipart/form-data">

<div class="drop-zone"
onclick="document.getElementById('excelFile').click()">

<p>📊 Upload Excel File</p>

<input
id="excelFile"
type="file"
name="excelFile"
accept=".xls,.xlsx"
hidden
required>

<div id="fileList"></div>

</div>

<br>
<div id="pdfPreview"></div>

<canvas id="pdfCanvas" style="
max-width:100%;
margin-top:20px;
border-radius:12px;
display:none;
"></canvas>

<button type="submit">
Convert to PDF
</button>

</form>

</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>
</body>
</html>

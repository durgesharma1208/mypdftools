<!DOCTYPE html>
<html>
<head>
    <title>Rotate PDF | MyPDFTools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h1>
        <a href="index.html" style="color:white;text-decoration:none;">
            MyPDFTools
        </a>
    </h1>
</nav>

<div class="container">

    <h2>🔄 Rotate PDF</h2>

    <p>Rotate all pages by 90°.</p>

    <a href="index.html">
        <button type="button">
            ← Back to Home
        </button>
    </a>

    <br><br>

    <form action="/rotate" method="POST" enctype="multipart/form-data">

   <div class="drop-zone" onclick="document.getElementById('pdfFile').click()">
    <p>📂 Drag & Drop PDF Here</p>
    <p>or Click to Upload</p>

    <input
        id="pdfFile"
        type="file"
        name="pdfFile"
        accept=".pdf"
        required
        hidden>

    <div class="file-list" id="fileList"></div>
</div>
    <br><br>

    <label>Rotation:</label>

    <select name="angle">
        <option value="90">90° Right</option>
        <option value="-90">90° Left</option>
        <option value="180">180°</option>
    </select>

    <br><br>
<div id="pdfPreview"></div>

<canvas id="pdfCanvas" style="
max-width:100%;
margin-top:20px;
border-radius:12px;
display:none;
"></canvas>

    <button type="submit">
        Rotate PDF
    </button>

</form>
<div class="loader" id="loader"></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>
</body>
</html>

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      APP_ENV: production
      CORS_ORIGINS: http://localhost:8080
      MAX_FILE_SIZE_MB: "50"
      MAX_FILES: "10"
    ports:
      - "8001:8000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

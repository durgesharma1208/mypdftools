<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MyPDFTools — Merge, split, compress, convert and secure PDFs instantly. Free, private, no sign-up required. Your files are never stored." />
    <meta name="keywords" content="PDF tools, merge PDF, split PDF, compress PDF, convert PDF, protect PDF, free PDF tools" />
    <meta property="og:title" content="MyPDFTools — Every PDF tool you need, in one place" />
    <meta property="og:description" content="20+ free PDF tools: merge, split, compress, convert, protect. Private by design — files deleted after processing." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0d12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>MyPDFTools — Every PDF tool you need, in one place</title>
    <script>
      // Apply saved theme synchronously to avoid flash
      (function () {
        const stored = localStorage.getItem('mypdftools-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = stored === 'dark' || (!stored && prefersDark);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
